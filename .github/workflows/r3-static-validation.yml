name: R3 Static Repository Validation

on:
  push:
    branches: [main]
    paths:
      - "Horror Motel Fable/**"
      - ".github/workflows/r3-static-validation.yml"
  pull_request:
    paths:
      - "Horror Motel Fable/**"
      - ".github/workflows/r3-static-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-r3:
    name: Validate R3 registers and cross-references
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run static repository validator
        working-directory: Horror Motel Fable
        run: python tools/validate_r3_repository.py
