<path d="M1135 700 h75" class="dash"/><text x="1170" y="680" class="note" text-anchor="middle">Secret door</text>
<text x="930" y="815" class="dim">Floor Z=+3.60</text><text x="930" y="575" class="dim">Ceiling underside Z=+6.80</text>
