<line x1="200" y1="320" x2="545" y2="320" class="floor"/>
<text x="360" y="260" class="lab" text-anchor="middle">UPPER ROOM</text><text x="360" y="470" class="lab" text-anchor="middle">GROUND ROOM</text>
<text x="570" y="108" class="dim">Roof / ceiling top Z=7.10</text><text x="570" y="326" class="dim">Upper floor Z=3.60</text><text x="570" y="545" class="dim">Ground floor Z=0.00</text>
<line x1="150" y1="100" x2="150" y2="550" stroke="#273744" stroke-width="2"/><path d="M142 100h16 M142 550h16" stroke="#273744" stroke-width="2"/>
