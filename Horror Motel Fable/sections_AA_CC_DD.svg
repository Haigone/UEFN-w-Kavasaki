<!-- section D -->
<text x="900" y="665" class="lab">SECTION D-D — SECRET ROUTE / ROOM 13</text>
<rect x="930" y="770" width="560" height="18" class="slab"/>
<rect x="930" y="590" width="15" height="180" class="wall"/>
<rect x="1475" y="590" width="15" height="180" class="wall"/>
<rect x="1120" y="590" width="15" height="180" class="wall"/>
