<path d="M200 930 h28 v-18 h28 v-18 h28 v-18 h28 v-18 h28 v-18 h28 v-18 h28 v-18 h28 v-18 h28 v-18 h28 v-18 h28 v-18 h28 v-18 h28 v-18 h28 v-18 h28 v-18 h28 v-18 h28 v-18 h28 v-18 h28 v-18 h28 v-18 h28 v-18 h28 v-18 h28 v-18 h28 v-18 h28 v-18 h28 v-18 h28 v-18 h28 v-18" fill="none" stroke="#273744" stroke-width="5"/>
<text x="520" y="955" class="dim" text-anchor="middle">20 risers target · 0.18 m rise · 0.28 m tread · 1.20 m clear width</text>
