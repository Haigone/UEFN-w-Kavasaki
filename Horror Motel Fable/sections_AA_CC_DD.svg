<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100">
<defs><style>
text{font-family:Arial,Helvetica,sans-serif;fill:#202b35}.h{font-size:32px;font-weight:700}.s{font-size:17px;fill:#596875}.lab{font-size:18px;font-weight:700}.dim{font-size:15px;fill:#45535e}.wall{fill:#b9c4cb;stroke:#273744;stroke-width:3}.slab{fill:#7e8c96;stroke:#273744;stroke-width:2}.floor{stroke:#273744;stroke-width:4}.dash{stroke:#a13a52;stroke-width:4;stroke-dasharray:9 7}.note{font-size:14px;fill:#7c3448}
</style></defs><rect width="1600" height="1100" fill="#fbfaf7"/>
<text x="70" y="65" class="h">BUILDING SECTIONS — A-A / C-C / D-D</text>
<text x="70" y="98" class="s">Vertical design targets · all elevations in metres · schematic section drawings, not construction-certified</text>
<!-- section A-A -->
<text x="100" y="165" class="lab">SECTION A-A — WEST WING THROUGH BOTH FLOORS</text>
<line x1="160" y1="550" x2="1120" y2="550" class="floor"/>
